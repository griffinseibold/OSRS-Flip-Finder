{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Chart.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
spec:
  {{- $hostnames := .Values.httpRoute.hostnames }}
  {{- if not $hostnames }}
  {{- range .Values.httpRoute.domains }}
  {{- $hostnames = append $hostnames (printf "%s.%s" $.Chart.Name .) }}
  {{- end }}
  {{- end }}
  {{- with $hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Chart.Name }}
          port: 80
{{- end }}
