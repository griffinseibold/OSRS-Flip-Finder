apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flipfinder
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/griffinseibold/Flip-Finder
    path: chart/flipfinder
    targetRevision: master
  destination:
    server: https://kubernetes.default.svc
    namespace: flipfinder
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
