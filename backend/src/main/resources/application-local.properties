spring.datasource.url=jdbc:sqlite:file:flipfinder?mode=memory&cache=shared
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.max-lifetime=0

# The standalone version keeps two days of trading history in memory. It is
# fetched within seconds of starting, so unusual trading can be flagged
# without a persistent volume.
flipfinder.history.enabled=true
flipfinder.history.five-minute-days=2
flipfinder.history.hourly-days=2
flipfinder.history.five-minute-backfill-hours=2
