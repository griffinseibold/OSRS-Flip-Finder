spring.application.name=flipfinder
spring.profiles.default=local

spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.sql.init.mode=always

server.port=${SERVER_PORT:8081}

management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info

springdoc.swagger-ui.path=/swagger-ui.html

flipfinder.ingest.base-url=https://prices.runescape.wiki/api/v2/osrs
flipfinder.ingest.user-agent=OSRS-Flip-Finder/0.1 (+https://github.com/griffinseibold/OSRS-Flip-Finder)
flipfinder.ingest.poll-delay-ms=300000
