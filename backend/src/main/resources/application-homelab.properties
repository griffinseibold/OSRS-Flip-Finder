spring.datasource.url=jdbc:sqlite:${FLIPFINDER_DB_PATH:/data/flipfinder.db}
flipfinder.runelite.enabled=true
# The homelab's llama.cpp server. Set FLIPFINDER_LLM_URL to use another, such as
# http://llm.localhost:8080/v1 when running outside the cluster.
flipfinder.llm.base-url=${FLIPFINDER_LLM_URL:http://llama-server.llm.svc.cluster.local/v1}
