<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Old School RuneScape Grand Exchange flips ranked by margin after tax." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>OSRS Flip Finder</title>
    <script>
      // Apply the saved theme, or else the system's, before the first paint (see src/hooks/useTheme.ts).
      (function () {
        var theme;
        try {
          theme = localStorage.getItem('flipfinder.theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
